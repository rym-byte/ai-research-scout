<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Scout - 智能研究助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f6f3;
            --bg-tertiary: #f1f1ef;
            --text-primary: #37352f;
            --text-secondary: #6b6b6b;
            --accent: #2eaadc;
            --accent-hover: #1a8cd8;
            --border: #e3e2e0;
            --card-bg: #ffffff;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 20px 0;
        }
        
        .header-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        /* Search Card */
        .search-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-primary);
        }
        
        .search-input::placeholder {
            color: #999;
        }
        
        /* Source Selection */
        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .source-card {
            position: relative;
            padding: 16px;
            background: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .source-card:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        
        .source-card.selected {
            background: rgba(46, 170, 220, 0.1);
            border-color: var(--accent);
        }
        
        .source-card input {
            position: absolute;
            opacity: 0;
        }
        
        .source-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .source-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .source-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Search Button */
        .search-btn {
            width: 100%;
            padding: 16px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 170, 220, 0.3);
        }
        
        .search-btn:active {
            transform: translateY(0);
        }
        
        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        
        .feature-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        
        .feature-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        
        .feature-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 16px;
            }
            
            .header h1 {
                font-size: 26px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .sources-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🔍</div>
            <h1>AI Research Scout</h1>
            <p>输入关键词，选择信源，AI 自动生成研究报告</p>
        </div>

        <div class="search-card">
            <form action="/research" method="POST">
                <div class="input-group">
                    <label class="input-label">研究主题</label>
                    <input type="text" name="topic" class="search-input" 
                           placeholder="例如：AI Agent 自动化工具、区块链最新趋势..." required />
                </div>

                <div class="input-group">
                    <label class="input-label">选择数据源</label>
                    <div class="sources-grid">
                        <div class="source-card selected" onclick="toggleSource(this)">
                            <input type="checkbox" name="sources" value="hn" checked />
                            <div class="source-icon">📰</div>
                            <div class="source-name">Hacker News</div>
                            <div class="source-desc">科技趋势</div>
                        </div>
                        <div class="source-card" onclick="toggleSource(this)">
                            <input type="checkbox" name="sources" value="reddit" />
                            <div class="source-icon">💬</div>
                            <div class="source-name">Reddit</div>
                            <div class="source-desc">社区讨论</div>
                        </div>
                        <div class="source-card selected" onclick="toggleSource(this)">
                            <input type="checkbox" name="sources" value="web" checked />
                            <div class="source-icon">🌐</div>
                            <div class="source-name">Web 搜索</div>
                            <div class="source-desc">全网信息</div>
                        </div>
                        <div class="source-card" onclick="toggleSource(this)">
                            <input type="checkbox" name="sources" value="github" />
                            <div class="source-icon">💻</div>
                            <div class="source-name">GitHub</div>
                            <div class="source-desc">开源项目</div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="search-btn">
                    <span>🚀</span>
                    <span>开始研究</span>
                </button>
            </form>
        </div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">🤖</div>
                <div class="feature-title">AI 深度分析</div>
                <div class="feature-desc">DeepSeek 大模型智能解读</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <div class="feature-title">多源采集</div>
                <div class="feature-desc">一键抓取多个平台数据</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📄</div>
                <div class="feature-title">专业报告</div>
                <div class="feature-desc">Word / PDF / Markdown 导出</div>
            </div>
        </div>
    </div>

    <script>
        function toggleSource(card) {
            const checkbox = card.querySelector('input');
            checkbox.checked = !checkbox.checked;
            card.classList.toggle('selected', checkbox.checked);
        }
    </script>
</body>
</html>
