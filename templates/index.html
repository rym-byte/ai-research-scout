<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Scout - 智能研究助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 设计令牌 - OKLCH 色彩空间 */
        :root {
            /* 主色调 - 科技蓝紫 */
            --color-primary: oklch(0.65 0.2 270);
            --color-primary-light: oklch(0.75 0.15 270);
            --color-primary-dark: oklch(0.55 0.25 270);
            
            /* 背景色 - 带暖色调的深灰 */
            --color-bg: oklch(0.08 0.02 280);
            --color-bg-elevated: oklch(0.12 0.02 280);
            --color-bg-card: oklch(0.15 0.03 280);
            
            /* 文字色 - 带暖色调的灰白 */
            --color-text: oklch(0.95 0.01 80);
            --color-text-secondary: oklch(0.7 0.02 80);
            --color-text-tertiary: oklch(0.5 0.02 80);
            
            /* 功能色 */
            --color-success: oklch(0.7 0.2 150);
            --color-warning: oklch(0.75 0.18 80);
            --color-error: oklch(0.65 0.22 25);
            
            /* 间距系统 - 8px 基础 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;
            
            /* 字体 */
            --font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* 圆角 */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            
            /* 动效 */
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 150ms;
            --duration-normal: 300ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 布局 */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--space-5);
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: var(--space-8) 0 var(--space-6);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--color-text), var(--color-primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: var(--color-text-secondary);
            font-size: 18px;
            font-weight: 400;
            max-width: 480px;
            margin: 0 auto;
        }

        /* 搜索区域 */
        .search-section {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-bottom: var(--space-6);
            border: 1px solid oklch(0.2 0.02 280);
        }

        .search-form {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: var(--space-4) var(--space-5);
            padding-left: 48px;
            background: var(--color-bg);
            border: 2px solid oklch(0.25 0.02 280);
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-family: var(--font-family);
            font-size: 16px;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px oklch(0.65 0.2 270 / 0.2);
        }

        .search-input::placeholder {
            color: var(--color-text-tertiary);
        }

        .search-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-tertiary);
            pointer-events: none;
        }

        .btn {
            padding: var(--space-4) var(--space-6);
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px oklch(0.65 0.2 270 / 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 选项区域 */
        .options {
            display: flex;
            gap: var(--space-5);
            flex-wrap: wrap;
            align-items: center;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .option-group label {
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            gap: var(--space-3);
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            cursor: pointer;
            color: var(--color-text-secondary);
            font-size: 14px;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .checkbox-group label:hover {
            color: var(--color-text);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--color-primary);
            cursor: pointer;
        }

        select {
            padding: var(--space-2) var(--space-3);
            background: var(--color-bg);
            border: 1px solid oklch(0.25 0.02 280);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-family: var(--font-family);
            font-size: 14px;
            cursor: pointer;
        }


        /* 加载状态 - Skeleton */
        .loading {
            display: none;
            padding: var(--space-7) 0;
        }

        .loading.active {
            display: block;
        }

        .skeleton-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                var(--color-bg-card) 25%,
                oklch(0.2 0.02 280) 50%,
                var(--color-bg-card) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 180px;
            border-radius: var(--radius-lg);
        }

        /* 结果区域 */
        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .summary {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            border: 1px solid oklch(0.2 0.02 280);
        }

        .summary h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--color-text);
        }

        .summary p {
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .meta-info {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            display: flex;
            gap: var(--space-5);
            font-size: 14px;
            color: var(--color-text-secondary);
            flex-wrap: wrap;
        }

        /* 关键发现 */
        .findings {
            margin-bottom: var(--space-5);
        }

        .findings h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--color-text);
        }

        .findings ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .findings li {
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-elevated);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--color-primary);
            color: var(--color-text-secondary);
        }

        /* 热门内容 */
        .items {
            margin-bottom: var(--space-5);
        }

        .items h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--color-text);
        }

        .item {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            border: 1px solid oklch(0.2 0.02 280);
            transition: all var(--duration-normal) var(--ease-out);
            position: relative;
            overflow: hidden;
        }

        .item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
            opacity: 0;
            transition: opacity var(--duration-normal) var(--ease-out);
        }

        .item:hover {
            transform: translateY(-4px);
            border-color: oklch(0.3 0.03 280);
            box-shadow: 0 16px 48px oklch(0 0 0 / 0.3);
        }

        .item:hover::before {
            opacity: 1;
        }

        .item-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: var(--space-2);
        }

        .item-title a {
            color: var(--color-text);
            text-decoration: none;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .item-title a:hover {
            color: var(--color-primary-light);
        }

        .item-meta {
            font-size: 14px;
            color: var(--color-text-tertiary);
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .item-meta span {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        /* 历史记录 */
        .history {
            margin-top: var(--space-6);
            padding-top: var(--space-5);
            border-top: 1px solid oklch(0.2 0.02 280);
        }

        .history h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--color-text-secondary);
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .history-item {
            background: var(--color-bg-card);
            padding: var(--space-2) var(--space-3);
            border-radius: 20px;
            font-size: 14px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            border: 1px solid oklch(0.25 0.02 280);
        }

        .history-item:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-4);
            }

            .logo-text {
                font-size: 24px;
            }

            .search-form {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .meta-info {
                flex-direction: column;
                gap: var(--space-2);
            }
        }

        /* 减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🔬</div>
                <h1 class="logo-text">AI Research Scout</h1>
            </div>
            <p class="tagline">智能研究助手，自动搜集、分析并生成结构化研究报告</p>
        </header>

        <!-- 搜索区域 -->
        <section class="search-section">
            <form class="search-form" id="searchForm" onsubmit="event.preventDefault(); doResearch();">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input 
                        type="text" 
                        class="search-input" 
                        id="topic"
                        placeholder="输入研究主题，例如：量子计算最新进展..."
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="btn btn-primary" id="searchBtn">
                    <span>开始研究</span>
                    <span>→</span>
                </button>
            </form>
            
            <div class="options">
                <div class="option-group">
                    <label>国际数据源：</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="source-hn" checked> Hacker News
                        </label>
                        <label>
                            <input type="checkbox" id="source-web" checked> Web搜索
                        </label>
                        <label>
                            <input type="checkbox" id="source-reddit"> Reddit
                        </label>
                        <label>
                            <input type="checkbox" id="source-github"> GitHub
                        </label>
                        <label>
                            <input type="checkbox" id="source-youtube"> YouTube
                        </label>
                        <label>
                            <input type="checkbox" id="source-x"> X (Twitter)
                        </label>
                        <label>
                            <input type="checkbox" id="source-facebook"> Facebook
                        </label>
                        <label>
                            <input type="checkbox" id="source-instagram"> Instagram
                        </label>
                    </div>
                </div>
                <div class="option-group">
                    <label>国内数据源：</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="source-baidu" checked> 百度
                        </label>
                        <label>
                            <input type="checkbox" id="source-wechat"> 微信
                        </label>
                        <label>
                            <input type="checkbox" id="source-sogou"> 搜狗
                        </label>
                        <label>
                            <input type="checkbox" id="source-bilibili"> B站
                        </label>
                        <label>
                            <input type="checkbox" id="source-zhihu"> 知乎
                        </label>
                        <label>
                            <input type="checkbox" id="source-xiaohongshu"> 小红书
                        </label>
                        <label>
                            <input type="checkbox" id="source-douyin"> 抖音
                        </label>
                    </div>
                </div>
                <div class="option-group">
                    <label>数量：</label>
                    <select id="limit">
                        <option value="5">5条</option>
                        <option value="10" selected>10条</option>
                        <option value="20">20条</option>
                        <option value="30">30条</option>
                    </select>
                </div>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="skeleton-container">
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </div>

            <!-- 结果区域 -->
            <div class="results" id="results">
                <div class="summary">
                    <h3>📋 研究摘要</h3>
                    <p id="summary-text"></p>
                    <div class="meta-info" id="meta-info">
                        <span id="total-sources">📊 数据源: 0条</span>
                        <span id="sentiment">➖ 中性</span>
                        <span id="confidence">🎯 置信度: 0%</span>
                    </div>
                </div>

                <div class="findings">
                    <h3>🔍 关键发现</h3>
                    <ul id="findings-list"></ul>
                </div>

                <div class="items">
                    <h3>📰 热门内容</h3>
                    <div id="items-list"></div>
                </div>
            </div>

            {% if history %}
            <div class="history">
                <h3>📜 最近搜索</h3>
                <div class="history-list">
                    {% for item in history %}
                    <div class="history-item" onclick="document.getElementById('topic').value='{{ item.topic }}'">
                        {{ item.topic }}
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </section>
    </div>

    <script>
        async function doResearch() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) {
                alert('请输入研究主题');
                return;
            }

            const sources = [];
            // 国际数据源
            if (document.getElementById('source-hn').checked) sources.push('hn');
            if (document.getElementById('source-web').checked) sources.push('web');
            if (document.getElementById('source-reddit')?.checked) sources.push('reddit');
            if (document.getElementById('source-github')?.checked) sources.push('github');
            if (document.getElementById('source-youtube')?.checked) sources.push('youtube');
            if (document.getElementById('source-x')?.checked) sources.push('x');
            if (document.getElementById('source-facebook')?.checked) sources.push('facebook');
            if (document.getElementById('source-instagram')?.checked) sources.push('instagram');
            // 国内数据源
            if (document.getElementById('source-baidu')?.checked) sources.push('baidu');
            if (document.getElementById('source-wechat')?.checked) sources.push('wechat');
            if (document.getElementById('source-sogou')?.checked) sources.push('sogou');
            if (document.getElementById('source-bilibili')?.checked) sources.push('bilibili');
            if (document.getElementById('source-zhihu')?.checked) sources.push('zhihu');
            if (document.getElementById('source-xiaohongshu')?.checked) sources.push('xiaohongshu');
            if (document.getElementById('source-douyin')?.checked) sources.push('douyin');

            const limit = parseInt(document.getElementById('limit').value);

            // 显示加载
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch('/api/research', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic, sources, limit})
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                // 显示结果
                document.getElementById('summary-text').innerHTML = data.report.summary.replace(/\n/g, '<br>');
                
                // 显示元信息
                if (data.report.total_sources !== undefined) {
                    document.getElementById('total-sources').textContent = `📊 数据源: ${data.report.total_sources}条`;
                    
                    const sentimentMap = {positive: '📈 积极倾向', negative: '📉 负面倾向', neutral: '➖ 中性'};
                    document.getElementById('sentiment').textContent = sentimentMap[data.report.sentiment] || '➖ 中性';
                    
                    document.getElementById('confidence').textContent = `🎯 置信度: ${(data.report.confidence * 100).toFixed(0)}%`;
                }

                const findingsList = document.getElementById('findings-list');
                findingsList.innerHTML = data.report.key_findings.map(f => `<li>${f}</li>`).join('');

                const itemsList = document.getElementById('items-list');
                itemsList.innerHTML = data.items.map(item => `
                    <div class="item">
                        <div class="item-title">
                            <a href="${item.url}" target="_blank">${item.title}</a>
                        </div>
                        <div class="item-meta">
                            <span>📍 ${item.source}</span>
                            <span>👤 ${item.author}</span>
                            <span>🔥 ${item.score}</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById('results').classList.add('active');
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('searchBtn').disabled = false;
            }
        }

        // 回车搜索
        document.getElementById('topic').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doResearch();
        });
    </script>
</body>
</html>
