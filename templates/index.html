<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Scout - 智能研究助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .option-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-group label {
            font-weight: 500;
            color: #333;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .results {
            display: none;
        }
        .results.active {
            display: block;
        }
        .summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .summary h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .findings {
            margin-bottom: 20px;
        }
        .findings h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .findings ul {
            list-style: none;
        }
        .findings li {
            padding: 10px 15px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .items {
            margin-top: 20px;
        }
        .items h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .item:hover {
            transform: translateX(5px);
        }
        .item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .item-title a {
            color: #667eea;
            text-decoration: none;
        }
        .item-title a:hover {
            text-decoration: underline;
        }
        .item-meta {
            font-size: 14px;
            color: #666;
            display: flex;
            gap: 15px;
        }
        .item-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .history {
            margin-top: 30px;
        }
        .history h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-item {
            background: #f0f0f0;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 AI Research Scout</h1>
            <p>智能研究助手 - 一键生成研究报告</p>
        </div>

        <div class="card">
            <div class="search-box">
                <input type="text" id="topic" placeholder="输入你想研究的主题，如：AI Agent、GPT-5、创业融资..." />
                <button class="btn" id="searchBtn" onclick="doResearch()">
                    开始研究
                </button>
            </div>

            <div class="options">
                <div class="option-group">
                    <label>数据源：</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="source-hn" checked> Hacker News
                        </label>
                        <label>
                            <input type="checkbox" id="source-web" checked> Web搜索
                        </label>
                    </div>
                </div>
                <div class="option-group">
                    <label>数量：</label>
                    <select id="limit" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
                        <option value="5">5条</option>
                        <option value="10" selected>10条</option>
                        <option value="20">20条</option>
                        <option value="30">30条</option>
                    </select>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在收集和分析数据...</p>
            </div>

            <div class="results" id="results">
                <div class="summary">
                    <h3>📋 摘要</h3>
                    <p id="summary-text"></p>
                </div>

                <div class="findings">
                    <h3>🔍 关键发现</h3>
                    <ul id="findings-list"></ul>
                </div>

                <div class="items">
                    <h3>📰 热门内容</h3>
                    <div id="items-list"></div>
                </div>
            </div>

            {% if history %}
            <div class="history">
                <h3>📜 最近搜索</h3>
                <div class="history-list">
                    {% for item in history %}
                    <div class="history-item" onclick="setTopic('{{ item.topic }}')">
                        {{ item.topic }}
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        function setTopic(topic) {
            document.getElementById('topic').value = topic;
        }

        async function doResearch() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) {
                alert('请输入研究主题');
                return;
            }

            const sources = [];
            if (document.getElementById('source-hn').checked) sources.push('hn');
            if (document.getElementById('source-web').checked) sources.push('web');

            const limit = parseInt(document.getElementById('limit').value);

            // 显示加载
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch('/api/research', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic, sources, limit})
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                // 显示结果
                document.getElementById('summary-text').textContent = data.report.summary;

                const findingsList = document.getElementById('findings-list');
                findingsList.innerHTML = data.report.key_findings.map(f => `<li>${f}</li>`).join('');

                const itemsList = document.getElementById('items-list');
                itemsList.innerHTML = data.items.map(item => `
                    <div class="item">
                        <div class="item-title">
                            <a href="${item.url}" target="_blank">${item.title}</a>
                        </div>
                        <div class="item-meta">
                            <span>📍 ${item.source}</span>
                            <span>👤 ${item.author}</span>
                            <span>🔥 ${item.score}</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById('results').classList.add('active');
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('searchBtn').disabled = false;
            }
        }

        // 回车搜索
        document.getElementById('topic').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doResearch();
        });
    </script>
</body>
</html>
